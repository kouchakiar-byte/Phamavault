<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" aria-hidden="true">
<style>
.fa,.fb{transform-box:fill-box;transform-origin:center;animation:pvf 6s ease-in-out infinite}
.fb{animation-duration:7.5s}
@keyframes pvf{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.fa,.fb{animation:none}}
</style>
<defs>
<filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0b1f3a" flood-opacity=".22"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
<linearGradient id="capTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe3dd"/><stop offset=".45" stop-color="#2cc4bc"/><stop offset="1" stop-color="#127c77"/></linearGradient>
<linearGradient id="capGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset=".45" stop-color="#dcbd6d"/><stop offset="1" stop-color="#9c7a2c"/></linearGradient>
<linearGradient id="capWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#eef2f5"/><stop offset="1" stop-color="#b9c6d1"/></linearGradient>
<linearGradient id="capRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59a9a"/><stop offset=".45" stop-color="#d9534f"/><stop offset="1" stop-color="#8f2724"/></linearGradient>
<radialGradient id="tab" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef2f6"/><stop offset="1" stop-color="#c9d4de"/></radialGradient>
<linearGradient id="tabEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fb1c1"/></linearGradient>
<radialGradient id="tabBlue" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e3f1ff"/><stop offset=".7" stop-color="#9ccaf2"/><stop offset="1" stop-color="#5d93c7"/></radialGradient>
<radialGradient id="gel" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff2b8" stop-opacity=".95"/><stop offset=".45" stop-color="#f2b739" stop-opacity=".9"/><stop offset="1" stop-color="#a8650b" stop-opacity=".95"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe9e6" stop-opacity=".55"/><stop offset=".35" stop-color="#ffffff" stop-opacity=".25"/><stop offset=".7" stop-color="#d7f2f0" stop-opacity=".35"/><stop offset="1" stop-color="#8fd3ce" stop-opacity=".6"/></linearGradient>
<linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd6cf" stop-opacity=".85"/><stop offset="1" stop-color="#1a9e97" stop-opacity=".95"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#9aa9b6"/><stop offset="1" stop-color="#5e6d79"/></linearGradient>
<linearGradient id="neck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c7a2c"/><stop offset=".5" stop-color="#f6e2a6"/><stop offset="1" stop-color="#9c7a2c"/></linearGradient>
