* { box-sizing: border-box; }

dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }

.toast { position: fixed; bottom: 16px; inset-inline-start: 16px; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding-block: 0 24px; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } .brand small { display: none; } }
</style>

    on("#reset", async () => { try { localStorage.removeItem(KEY); } catch (e) {} await seed(); toast("نسخه نمایشی به حالت اول برگشت."); render(); });
  }
  (async () => { if (!load()) await seed(); render(); })();
})();
</script>
</body>
</html>
