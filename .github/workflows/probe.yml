name: Probe live site (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -sS -D /tmp/h -o /tmp/p.html --max-time 60 "https://pharmavault.ir/fa?nocache=$RANDOM" && break; sleep 5; done
          grep -iE "^(HTTP|date|age|x-nextjs-cache|etag|last-modified)" /tmp/h || true
          echo "--- markers"
          grep -oE "دوازده بخش|یازده بخش|رفرنس استانداردها و ریجنت|lg:grid-rows-\[1fr_auto_auto_1fr\]|lg:grid-rows-\[auto_1fr\]" /tmp/p.html | sort | uniq -c
          grep -oE '"buildId":"[^"]+"|/_next/static/[A-Za-z0-9_-]{10,}/_buildManifest' /tmp/p.html | head -3
