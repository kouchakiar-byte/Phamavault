name: Probe live site (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "/fa?n=$RANDOM" "/fa/pharmacy/interactions?n=$RANDOM"; do
            curl -sS -D /tmp/h -o /tmp/p.html --max-time 60 "https://pharmavault.ir$u" || true
            echo "== $u"; grep -iE "^(HTTP|date|x-nextjs-cache|etag)" /tmp/h || true
            grep -oE "دوازده بخش|یازده بخش|lg:grid-rows-\[1fr_auto_auto_1fr\]|lg:grid-rows-\[auto_1fr\]|Micromedex|Lexicomp" /tmp/p.html | sort | uniq -c
          done
