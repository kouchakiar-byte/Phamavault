name: Probe live site (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          for i in $(seq 1 50); do
            curl -sS -o /tmp/p.html --max-time 60 "https://pharmavault.ir/fa?n=$RANDOM" || true
            if grep -q "دوازده بخش" /tmp/p.html; then echo "NEW VERSION LIVE at $(date -u +%H:%M:%S)"; grep -oE "lg:grid-rows-\[1fr_auto_auto_1fr\]" /tmp/p.html | head -1; exit 0; fi
            echo "$(date -u +%H:%M:%S) still old"; sleep 30
          done
          echo "STILL OLD after 25 minutes"
