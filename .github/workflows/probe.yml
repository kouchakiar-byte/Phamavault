name: Probe live site (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== status"; curl -sS --max-time 60 https://pharmavault.ir/api/cron/catalog; echo
          curl -sS -o /tmp/p.html --max-time 60 "https://pharmavault.ir/fa/suppliers?n=$RANDOM"
          echo "== supplier page dates"; grep -oE "<time[^>]*>[^<]*</time>|آخرین به‌روزرسانی[^<]{0,60}" /tmp/p.html | head
          curl -sS -o /tmp/m.html --max-time 60 "https://pharmavault.ir/fa/materials?n=$RANDOM"
          echo "== materials page dates"; grep -oE "<time[^>]*>[^<]*</time>|آخرین به‌روزرسانی[^<]{0,60}" /tmp/m.html | head
