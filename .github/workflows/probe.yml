name: Probe live site (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in / /fa /favicon.ico /icon.svg /icon1.png /icon2.png /apple-icon.png /robots.txt /manifest.webmanifest; do
            echo "== $u"; curl -sS -A "$UA" -o /tmp/b -D - --max-time 40 "https://pharmavault.ir$u" | grep -iE "^(HTTP|location|content-type|content-length|cache-control|x-robots-tag)"; file /tmp/b | cut -c1-120
          done
          echo "== robots"; curl -sS https://pharmavault.ir/robots.txt
          echo "== head icon links on /fa"; curl -sS -A "$UA" https://pharmavault.ir/fa | grep -oE '<link[^>]*(icon|manifest)[^>]*>' 
          echo "== head icon links on / (follow)"; curl -sSL -A "$UA" https://pharmavault.ir/ | grep -oE '<link[^>]*(icon|manifest)[^>]*>' | head
          echo "== site name markup"; curl -sS -A "$UA" https://pharmavault.ir/fa | grep -oE '"@type":"WebSite"[^}]*}' | head -2
