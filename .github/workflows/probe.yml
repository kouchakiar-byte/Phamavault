name: Probe live site
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in /fa /fa/suppliers /api/cron/catalog; do
            echo "== $u"; curl -sS -D - -o /tmp/p.html --max-time 60 "https://pharmavault.ir$u" | grep -iE "^(HTTP|cache-control|age|x-nextjs|x-vercel|last-modified|date|etag|server|x-cache)" || true
            grep -oE "(۱۳۹|۱۴۸|139|148) شرکت|(۲۱۶۴|۲۱۹۶|۲٬۱۶۴|۲٬۱۹۶)[^<]{0,12}" /tmp/p.html | sort | uniq -c | head
            head -c 600 /tmp/p.html | grep -o '"runs".*' || true
          done
