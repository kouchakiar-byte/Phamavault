name: Temporary photo probe
on:
  push:
    branches: ["claude/**"]
    paths: [".github/probe/photos.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/photos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe
          git commit -m "Temporary: photo probe output"
          git push
