name: pubchem probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/pubchem-probe.yml", ".github/probe/pubchem.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/pubchem.py > .github/probe/out.jsonl
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe/out.jsonl
          git commit -m "Temporary: pubchem probe output"
          git push origin HEAD:${GITHUB_REF_NAME}
