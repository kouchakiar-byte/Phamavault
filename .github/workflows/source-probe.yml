name: Source probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/source-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe search URL templates
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          while read -r url; do
            [ -z "$url" ] && continue
            out=$(curl -sL -A "$UA" -o /tmp/b -w "%{http_code} %{url_effective}" --max-time 25 "$url" || echo "ERR")
            size=$(wc -c < /tmp/b 2>/dev/null || echo 0)
            hit=$(grep -io "microcrystalline" /tmp/b | head -1)
            echo "$out size=$size hit=${hit:-none} <= $url"
          done <<'LIST'
          https://pubchem.ncbi.nlm.nih.gov/#query=microcrystalline%20cellulose
          https://commonchemistry.cas.org/results?q=microcrystalline%20cellulose
          https://gsrs.ncats.nih.gov/ginas/app/beta/browse-substance?search=microcrystalline%20cellulose
          https://webbook.nist.gov/cgi/cbook.cgi?Name=microcrystalline%20cellulose&Units=SI
          https://go.drugbank.com/unearth/q?searcher=drugs&query=microcrystalline%20cellulose
          https://www.accessdata.fda.gov/scripts/cder/iig/index.cfm
          https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=microcrystalline%20cellulose
          https://pubmed.ncbi.nlm.nih.gov/?term=microcrystalline%20cellulose
          https://europepmc.org/search?query=microcrystalline%20cellulose
          https://www.ema.europa.eu/en/search?search_api_fulltext=microcrystalline%20cellulose
          https://www.fda.gov/search?s=microcrystalline%20cellulose
          https://search.usa.gov/search?affiliate=fda1&query=microcrystalline%20cellulose
          https://www.ich.org/search?keys=microcrystalline%20cellulose
          https://www.ich.org/page/search?keys=microcrystalline%20cellulose
          https://iris.who.int/discover?query=microcrystalline%20cellulose
          https://www.edqm.eu/en/search?q=microcrystalline%20cellulose
          https://www.edqm.eu/en/web/edqm/search?q=microcrystalline%20cellulose
          https://www.usp.org/search?keys=microcrystalline%20cellulose
          https://www.usp.org/search?search_api_fulltext=microcrystalline%20cellulose
          https://echa.europa.eu/search-for-chemicals?p_p_id=disssimplesearch_WAR_disssearchportlet&_disssimplesearch_WAR_disssearchportlet_searchOccurred=true&_disssimplesearch_WAR_disssearchportlet_sskeywordKey=microcrystalline%20cellulose
          https://www.ebi.ac.uk/chebi/advancedSearchFT.do?searchString=microcrystalline%20cellulose
          https://www.chemspider.com/Search.aspx?q=microcrystalline%20cellulose
          https://www.ncbi.nlm.nih.gov/pmc/?term=microcrystalline%20cellulose
          https://scholar.google.com/scholar?q=microcrystalline%20cellulose
          https://www.ema.europa.eu/en/medicines?search_api_fulltext=metformin
          https://www.accessdata.fda.gov/scripts/cder/daf/index.cfm?event=BasicSearch.process
          https://www.who.int/publications/i?healthtopics-hidden=true&publishingoffices-hidden=true&query=microcrystalline
          https://database.ich.org/sites/default/files/Q1A%28R2%29%20Guideline.pdf
          https://irc.fda.gov.ir/nfi
          https://www.drugs.com/search.php?searchterm=metformin
          https://www.medicines.org.uk/emc/search?q=metformin
          https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/aspirin/cids/TXT
          LIST
