# Monthly refresh of the FDA Orange Book data used by the pharmacy section.
# FDA updates the data files monthly; this job downloads them, rebuilds
# src/data/orange-book.json and commits it to main, which redeploys the site.
name: Orange Book data

on:
  schedule:
    - cron: "23 4 5 * *" # 5th of each month, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the Orange Book data files
        run: node scripts/orange-book/fetch.mjs "$RUNNER_TEMP/orange-book.zip"
      - name: Build src/data/orange-book.json
        run: |
          unzip -o -q "$RUNNER_TEMP/orange-book.zip" -d "$RUNNER_TEMP/ob"
          products=$(find "$RUNNER_TEMP/ob" -iname 'products.txt' | head -n 1)
          node scripts/orange-book/build.mjs "$products" src/data/orange-book.json
      - name: Commit when the data changed
        run: |
          git config user.name "pharmavault-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/orange-book.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Orange Book data update ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
