name: Chain probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/chain-probe.yml", "scripts/probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types scripts/probe/chain-test.mts
