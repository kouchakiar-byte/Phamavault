name: Android app

# Builds the PharmaVault Android app (android/): a signed APK for Myket and a
# signed AAB/APK for Cafe Bazaar. Signing uses the ANDROID_* repository secrets;
# without them the build is signed with a debug key, good for testing only.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 -d > release.keystore
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Rename outputs
        run: |
          mkdir -p out
          suffix=$([ "$HAS_KEYSTORE" = true ] && echo signed || echo debug-signed)
          cp app/build/outputs/apk/release/app-release.apk "out/pharmavault-$suffix.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/pharmavault-$suffix.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: pharmavault-android
          path: android/out/
