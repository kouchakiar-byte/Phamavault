name: std probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/std-probe.yml", ".github/probe/*.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search for reference-standard and reagent suppliers
        run: python3 .github/probe/std.py > .github/probe/out.jsonl
      - name: Save the output to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/probe/out.jsonl
          git commit -m "Temporary: std probe output"
          git push origin HEAD:${GITHUB_REF_NAME}
