name: Docs probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/docs-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find Liara email docs
        run: |
          curl -sL --max-time 30 https://docs.liara.ir/sitemap.xml -o sm.xml; echo "sitemap bytes: $(wc -c < sm.xml)"
          grep -oE "https://docs.liara.ir/[^<]*(email|mail)[^<]*" sm.xml | sort -u | head -60
          for u in $(grep -oE "https://docs.liara.ir/[^<]*(email|mail)[^<]*" sm.xml | sort -u | grep -iE "inbound|receiv|incoming|about|quick|inbox|mailbox|dns|domain" | head -8); do
            echo "=================== $u"
            curl -sL --max-time 30 "$u" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | grep -v "^\s*$" | head -c 3500; echo
          done
